name: Run 24/7 Bot

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Chrome & Clean Old Drivers
        run: |
          sudo rm -f /usr/bin/chromedriver /usr/local/bin/chromedriver
          sudo apt-get update
          sudo apt-get install -y wget fonts-liberation
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install selenium google-genai python-dotenv webdriver-manager pytz

      - name: Run Bot
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          FB_C_USER: ${{ secrets.FB_C_USER }}
          FB_XS_TOKEN: ${{ secrets.FB_XS_TOKEN }}
          E2EE_PIN: ${{ secrets.E2EE_PIN }}
        run: python bot.py
