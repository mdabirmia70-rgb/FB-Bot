name: Run 24/7 Bot

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Chrome & Chromedriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable chromedriver

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install selenium google-genai python-dotenv

      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_C_USER: ${{ secrets.FB_C_USER }}
          FB_XS_TOKEN: ${{ secrets.FB_XS_TOKEN }}
          E2EE_PIN: ${{ secrets.E2EE_PIN }}
        run: python bot.py
